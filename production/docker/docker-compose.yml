services:
  cashbox-api:
    container_name: cashbox-api
    build:
      context: ../..
      dockerfile: production/docker/Dockerfile
    ports:
      - "3633:3633"
    environment:
      NODE_ENV: production
      PORT: "3633"
    volumes:
      # Persist LevelDB outside the container (maps to app default data/config-db)
      - ../data/leveldb:/app/data/config-db
    restart: unless-stopped

  cashbox-ui:
    container_name: cashbox-ui
    build:
      context: .
      dockerfile: Dockerfile.cash-box-fe
      args:
        # Optional: pin a branch or tag (leave unset to use the repo default branch)
        # CASH_BOX_FE_REF: master
        CASH_BOX_FE_REPO: https://github.com/Permissionless-Software-Foundation/cash-box-fe.git
    ports:
      - "8080:80"
    depends_on:
      - cashbox-api
    restart: unless-stopped
